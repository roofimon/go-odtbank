services:
  postgres:
    image: postgres:16-alpine
    container_name: go-odtbank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: odtbank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odtbank"]
      interval: 2s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://postgres:postgres@postgres:5432/odtbank?sslmode=disable"]

volumes:
  postgres-data: